# Solo baseline — no minion exists for this session. Added 2026-08-25 (exp5) for the
# comparison this project has never actually run: the same model doing a task alone vs.
# doing it as Gru with a minion. Everything else (harness, verification style, workflow
# shape) stays identical to gru.yaml; only the *_solo.md fragments differ, and only by
# removing minion mentions — `tool_policy.allow_delegate: false` is what actually
# removes the delegate_to_minion tool from this session (orchestrator/gru_toolcall.py).
# Full rationale: prompts/gru-loop.md's exp5 revision notes.
agent:
  system_template_fragments:
    - role_solo
    - task_approach_solo
    - actions_solo
    - verification_solo

  instance_template: |
    <pr_description>
    Consider the following PR description:
    {{ task_description }}
    </pr_description>

    <repository_context>
    {{ repo_name }}, accessible at {{ repo_path_or_access_instructions }}
    </repository_context>

    Work the task per the system instructions. Start by restating what you understand the task to require, then take your first step.

  step_limit: 80
  max_consecutive_format_errors: 6
  cost_limit: 0
  wall_time_limit_seconds: 0

tool_policy:
  allow_delegate: false

model:
  model_kwargs:
    drop_params: true
    parallel_tool_calls: false
