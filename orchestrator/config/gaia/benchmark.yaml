# GAIA sibling of swe_bench/benchmark.yaml. Same Gru loop, same prompt fragments (this
# directory's gru.yaml reuses swe_bench/gru.yaml's fragment list verbatim); what differs
# is the dataset, the sandbox image, and the instance_template — see
# orchestrator/benchmarks/gaia.py.
#
#   python -m orchestrator.run_session --benchmark gaia      --instance <task-id> ...
#   python -m orchestrator.run_session --benchmark gaia/solo --instance <task-id> ...
benchmark:
  loader: gaia
  dataset:
    split: validation
  environment: environment.yaml
  gru: gru.yaml
  minion: minion.yaml

  variants:
    # GAIA's no-minion baseline; see swe_bench/benchmark.yaml's `solo`.
    solo:
      gru: gru-solo.yaml
