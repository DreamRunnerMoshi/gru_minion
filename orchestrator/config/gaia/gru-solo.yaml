# Solo baseline for GAIA — sibling of orchestrator/config/swe_bench/gru-solo.yaml. Same shared
# *_solo.md fragments (unchanged, no GAIA-specific copy — see gaia_environment.py's
# module docstring for why that matters), same tool_policy.allow_delegate: false
# mechanism. Only instance_template differs, same minimum change as gaia.yaml's:
# a <question> tag instead of <pr_description>/<repository_context>, plus the
# last-check-prints-the-answer instruction finish() needs (see gaia.yaml's own note).
agent:
  system_template_fragments:
    - role_solo
    - task_approach_solo
    - actions_solo
    - verification_solo

  instance_template: |
    <question>
    {{ task_description }}
    </question>

    Work the task per the system instructions. Start by restating what you understand the task to require, then take your first step.

    Your final_verification's last check must print your final answer and nothing else on its last line of output — e.g. `python3 -c "print('<answer>')"` or `echo '<answer>'`. That check's own output is what gets scored, independent of anything you write in your summary.

  step_limit: 80
  max_consecutive_format_errors: 6
  cost_limit: 0
  wall_time_limit_seconds: 0

tool_policy:
  allow_delegate: false

model:
  model_kwargs:
    drop_params: true
    parallel_tool_calls: false
