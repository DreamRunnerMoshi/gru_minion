# Environment config for the ONE shared, persistent sandbox used for a whole GAIA
# session (Gru's own web_search/python_exec, plus every minion delegation). Sibling of
# swe_bench/environment.yaml — same DockerEnvironment class, no repo/testbed here, network
# enabled (SWE-bench containers get none; GAIA tasks need it for search).
environment:
  image: gaia-sandbox:latest
  cwd: /workspace
  timeout: 60
  pull_timeout: 120
  interpreter: ["bash", "-c"]
  forward_env:
    - TAVILY_API_KEY
  environment_class: docker
