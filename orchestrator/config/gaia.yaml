# Gru's runtime config for GAIA. Sibling of orchestrator/config/gru.yaml (SWE-bench) —
# same fragment-composition mechanism, pointed at orchestrator/prompts/gaia/. No
# "verification" fragment: unlike SWE-bench, finish() has no self-authored
# final_verification gate (there's no hidden test suite to approximate — GAIA scores an
# answer string against a hidden gold answer, done only after the session ends).
agent:
  system_template_fragments:
    - role
    - task_approach
    - actions
    - delegation

  instance_template: |
    <question>
    {{ task_description }}
    </question>

    Work the task per the system instructions. Start by identifying which sub-facts this question depends on, then take your first step.

  step_limit: 60
  max_consecutive_format_errors: 6
  cost_limit: 0
  wall_time_limit_seconds: 0

# tool_policy omitted deliberately: defaults (orchestrator/gaia_tools.py's
# GaiaToolPolicy) are fully permissive.

model:
  model_kwargs:
    drop_params: true
    parallel_tool_calls: false
