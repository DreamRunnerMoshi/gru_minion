# Gru's minimal variant (2026-08-24) — step 1 of a bit-by-bit ablation: just
# delegate_to_minion and a bare finish. No think, no run_check, no verdict
# delegations, no finish verification, no failure-handling guidance. Composed from
# the same fragment library as gru.yaml (orchestrator/prompts/gru/), sharing role.md
# and mode/oneshot-agentic wording with it — only the fragment list differs.
#
# The point of this variant: observe what a model given only "delegate, then handle
# whatever comes back" actually does with that, unshaped by verification or failure
# framing. Later steps in this ablation add pieces back one at a time (verification,
# then failure handling, then think/run_check) — see prompts/gru-loop.md.
agent:
  system_template_fragments:
    - role
    - actions_header
    - action_delegate
    - action_finish_bare
    - actions_footer
    - delegation_shape_findings_only

  instance_template: |
    <task>
    {{ task_description }}
    </task>

    <repository_context>
    {{ repo_name }}, accessible at {{ repo_path_or_access_instructions }}
    </repository_context>

    Work the task per the system instructions. Start by restating what you understand the task to require, then take your first step.

  step_limit: 80
  max_consecutive_format_errors: 6
  cost_limit: 0
  wall_time_limit_seconds: 0

tool_policy:
  allow_think: false
  allow_run_check: false
  allow_verdict: false
  require_finish_verification: false

model:
  model_kwargs:
    drop_params: true
    parallel_tool_calls: false
