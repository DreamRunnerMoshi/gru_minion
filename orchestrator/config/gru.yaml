# Gru's runtime config — the "full" variant: all four actions, verdict delegations
# allowed, finish requires verification. Prompt text composed from fragments under
# orchestrator/prompts/gru/ (orchestrator/gru_config.py resolves
# system_template_fragments into system_template at load time) rather than a literal
# block — see prompts/gru-loop.md for the design rationale and revision history.
#
# Revised 2026-08-24: converted from a literal system_template to fragment references,
# and stripped the prescriptive delegation criteria (the "token-heavy and
# judgement-light" framing, the two-part "before delegating" checklist) and the
# run_check write-rejection enforcement. Explicit user decision: do not force Gru's
# delegation behavior, even with a smaller model that may under-delegate — if it
# chooses not to delegate, that is a finding to observe, not a defect to engineer
# around. Same day, second step: modularized into fragments specifically so a leaner
# variant (orchestrator/config/gru-minimal.yaml — no verification, no failure
# handling, just delegate_to_minion and a bare finish) could be built by choosing a
# different fragment list instead of hand-writing a second long string. See
# prompts/gru-loop.md for the fuller rationale on both changes.
agent:
  system_template_fragments:
    - role
    - actions_header
    - action_delegate
    - action_think
    - action_run_check
    - action_finish
    - actions_footer
    - delegation_shape
    - failure_handling
    - verification_guidance

  instance_template: |
    <task>
    {{ task_description }}
    </task>

    <repository_context>
    {{ repo_name }}, accessible at {{ repo_path_or_access_instructions }}
    </repository_context>

    Work the task per the system instructions. Start by restating what you understand the task to require, then take your first step.

  step_limit: 80
  max_consecutive_format_errors: 6
  cost_limit: 0
  wall_time_limit_seconds: 0

# tool_policy omitted deliberately: defaults (orchestrator/gru_toolcall.py's
# ToolPolicy) are fully permissive — all four actions, verdict delegations allowed,
# finish requires verification — matching this file's behavior before ToolPolicy existed.

model:
  model_kwargs:
    drop_params: true
    # Belt and braces: Ollama silently dropped this in exp2 and Gru batched delegations.
    # One-action-per-turn is now enforced in orchestrator/gru_toolcall.py regardless.
    parallel_tool_calls: false
