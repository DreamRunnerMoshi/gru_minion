# Gru's runtime config. Prompt text composed from fragments under
# orchestrator/gru/prompts/ (orchestrator/gru/config.py resolves
# system_template_fragments into system_template at load time) rather than a literal
# block. Full design rationale and revision history: prompts/gru-loop.md — this file
# only carries the current fragment list and settings, not the history behind them.
agent:
  system_template_fragments:
    - role
    - task_approach
    - actions
    - delegation
    - verification

  instance_template: |
    <pr_description>
    Consider the following PR description:
    {{ task_description }}
    </pr_description>

    <repository_context>
    {{ repo_name }}, accessible at {{ repo_path_or_access_instructions }}
    </repository_context>

    Work the task per the system instructions. Start by restating what you understand the task to require, then take your first step.

  step_limit: 80
  max_consecutive_format_errors: 6
  cost_limit: 0
  wall_time_limit_seconds: 0

# tool_policy omitted deliberately: defaults (orchestrator/gru/toolcall.py's
# ToolPolicy) are fully permissive — all four actions, verdict delegations allowed,
# finish requires verification.

model:
  model_kwargs:
    drop_params: true
    # Belt and braces: Ollama silently dropped this in exp2 and Gru batched delegations.
    # One-action-per-turn is now enforced in orchestrator/gru/toolcall.py regardless.
    parallel_tool_calls: false
